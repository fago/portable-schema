$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero
status: experimental
description: A large heading with text, an image and a call to action.
props:
  type: object
  required:
    - heading
  properties:
    heading:
      title: Heading
      $ref: 'portable:label'
      minLength: 1
    text:
      title: Text
      $ref: 'portable:html'
    image:
      title: Image
      $ref: 'portable:image'
      properties:
        alt:
          minLength: 1
      required:
        - alt
    cta:
      title: Call to action
      $ref: 'portable:link'
  unevaluatedProperties: false
