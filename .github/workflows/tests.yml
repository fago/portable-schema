name: Tests

on:
  push:
  pull_request:

jobs:
  php:
    # Ships PHP 8.3 and Composer; third-party setup actions are not allowed in this organization.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: php -v | grep -q '^PHP 8\.3\.'
      - run: composer install --no-interaction --no-progress
      - run: composer test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
